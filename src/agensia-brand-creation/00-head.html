<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agensia Brand Creation</title>
<style>
/*{{FONTS}}*/
:root{
  --blue:#1A1ACC;        /* guide divider · Brand Method */
  --black:#0B0C0A;       /* client divider */
  --ink:#0B0C0A;         /* Agensia Ink */
  --ink-2:#3E403C;
  --ink-3:#8E9189;       /* Agensia Slate */
  --line:#D6D9D0;
  --line-2:#E8EBE2;
  --wash:#F2F4EE;        /* Agensia Mist */
  --green:#8AD000;       /* Agensia Green · signal only */
  --green-d:#6FA800;     /* Green Deep · the only green permitted to carry text */
  --green-soft:#EEF8D9;
  --green-line:#CDE9A0;
  --graphite:#5A5B5B;    /* Agensia Graphite */
  --paper:#FFFFFF;
  --amber:#B7861B;
  --signal:#C4403C;
  --s:1;
  --fd:'Ardela','Poppins',system-ui,sans-serif;      /* Display · Ardela Edge */
  --ft:'AgDot','Axiforma','Poppins',system-ui,sans-serif;    /* Text · brand and print */
  --fi:'AgDot','Inter',system-ui,sans-serif;                 /* Interface */
  --fm:'JetBrains Mono',ui-monospace,Menlo,monospace;/* Technical */
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#3A3A3A;font-family:var(--ft);color:var(--ink);-webkit-font-smoothing:antialiased;}
.deck{display:flex;flex-direction:column;align-items:center;gap:calc(26px*var(--s));padding:calc(26px*var(--s)) 0;}
.slide{width:calc(1920px*var(--s));height:calc(1080px*var(--s));position:relative;}
.canvas{width:1920px;height:1080px;background:#fff;position:absolute;top:0;left:0;transform:scale(var(--s));transform-origin:top left;overflow:hidden;padding:74px 84px 62px;display:flex;flex-direction:column;}

.canvas.guidepage{padding:74px 84px 62px;}

/* ---- presentation mode ---- */
body.deckmode{overflow:hidden;background:#1A1A1A;}
body.deckmode .deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0;gap:0;}
body.deckmode .slide{display:none;}
body.deckmode .slide.active{display:block;animation:slidein .2s ease both;}
@keyframes slidein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){body.deckmode .slide.active{animation:none;}}

#ctl{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;
     background:rgba(11,12,10,.94);border-radius:7px;padding:6px;z-index:100;
     opacity:1;transition:opacity .3s ease;}
#ctl.idle{opacity:0;pointer-events:none;}
#ctl button{background:none;border:none;color:#C8C8C8;cursor:pointer;padding:8px 12px;border-radius:4px;
     font-family:var(--fm);font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
#ctl button:hover:not(:disabled){background:#2E2E2E;color:#fff;}
#ctl button:disabled{opacity:.3;cursor:default;}
#ctl button:focus-visible{outline:2px solid var(--green);outline-offset:-2px;}
#ctl .count{color:#8A8A8A;font-family:var(--fm);font-size:11px;letter-spacing:.1em;
     padding:0 10px;min-width:86px;text-align:center;}
#ctl .count b{color:#fff;font-weight:500;}
#ctl .sep{width:1px;height:20px;background:#3A3A3A;margin:0 3px;}
#bar{position:fixed;left:0;bottom:0;height:2px;background:var(--green);z-index:101;transition:width .2s ease;}
body.exporting #ctl,body.exporting #bar{display:none;}
@media print{#ctl,#bar{display:none;}}

/* ---- viewer chrome (never exported) ---- */
#nav{position:fixed;right:0;top:0;bottom:0;width:290px;z-index:102;background:#0B0C0A;color:#fff;overflow-y:auto;z-index:99;transform:translateX(100%);transition:transform .22s ease;padding:22px 0 60px;}
#nav.open{transform:none;}
#nav h6{font-family:var(--fm);font-size:10px;letter-spacing:.2em;color:#7A7A7A;padding:16px 22px 8px;text-transform:uppercase;}
#nav a{display:flex;gap:12px;padding:8px 22px;color:#C8C8C8;text-decoration:none;font-size:12.5px;line-height:1.4;border-left:2px solid transparent;}
#nav a:hover{background:#1F1F1F;color:#fff;}
#nav a.on{border-left-color:var(--green);color:#fff;background:#1F1F1F;}
#nav a i{font-family:var(--fm);font-style:normal;font-size:10.5px;color:#6A6A6A;flex:none;width:20px;padding-top:1px;}
#nav a.div-b{color:#A9D96A;font-weight:500;}
#nav a.div-k{color:#fff;font-weight:500;}
#navbtn{position:fixed;right:18px;bottom:18px;z-index:100;background:#0B0C0A;color:#fff;border:none;border-radius:4px;padding:11px 16px;font-family:var(--fm);font-size:11px;letter-spacing:.14em;cursor:pointer;text-transform:uppercase;}
#navbtn:hover{background:#2A2A2A;}
#navbtn:focus-visible,#nav a:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
body.exporting #nav,body.exporting #navbtn{display:none;}
@media print{#nav,#navbtn{display:none;}}

/* ---- chrome ---- */
.chip{position:absolute;left:0;top:0;background:var(--wash);color:var(--ink-3);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:6px 16px;font-weight:400;font-family:var(--fm);}
.chip.method{background:#EDEDFA;color:#6A6ACC;}
.stitle{font-family:var(--fd);font-size:34px;font-weight:400;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);line-height:1.15;flex:none;}
.stitle .num{font-weight:700;margin-right:14px;}
.ssub{font-size:15px;font-weight:400;color:var(--ink-3);letter-spacing:.01em;margin-top:8px;}
.pnum{position:absolute;right:84px;bottom:34px;font-family:var(--fm);font-size:12px;color:#BFBFBF;letter-spacing:.1em;}
.foot{position:absolute;left:84px;bottom:34px;font-family:var(--fm);font-size:12px;color:#BFBFBF;letter-spacing:.1em;text-transform:uppercase;}
.body-area{flex:1;padding-top:34px;min-height:0;display:flex;flex-direction:column;}

/* ---- dividers ---- */
.divider{align-items:center;justify-content:center;padding:0;}
.divider span{font-family:var(--fd);font-size:66px;font-weight:700;letter-spacing:.02em;color:#fff;text-transform:uppercase;text-align:center;}
.divider.blue{background:var(--blue);}
.divider.black{background:var(--black);}
.divider.black span{color:#fff;}
.divider small{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-family:var(--fm);font-size:12px;letter-spacing:.22em;color:rgba(255,255,255,.5);text-transform:uppercase;}
.divider .dmark{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:center;}

/* ---- text ---- */
p.b{font-size:16px;line-height:1.65;color:var(--ink-2);font-weight:400;}
p.s{font-size:13.5px;line-height:1.6;color:var(--ink-3);font-weight:400;}
h3.h{font-size:18px;font-weight:600;letter-spacing:-.005em;color:var(--ink);}
.lbl{font-family:var(--fm);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500;}

/* ---- tables ---- */
table.t{width:100%;border-collapse:collapse;table-layout:fixed;}
table.t th{background:var(--wash);border:1px solid var(--line);text-align:left;padding:11px 13px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);}
table.t td{border:1px solid var(--line);padding:11px 13px;font-size:13.5px;line-height:1.5;color:var(--ink-2);font-weight:400;vertical-align:top;}
table.t td b{font-weight:600;color:var(--ink);}
table.t tr.hl td{background:#F7FCEC;}
table.t.lg td{font-size:16.5px;padding:16px 20px;line-height:1.55;}
table.t.lg th{font-size:13px;padding:15px 20px;}
table.t.lg td b{font-size:17px;}
.body-area.mid{justify-content:center;align-items:center;}
.body-area.mid > *{width:100%;}
table.t.sm td{font-size:12.5px;padding:9px 11px;}
table.t.sm th{font-size:11px;padding:9px 11px;}
.ti{width:15px;height:15px;flex:none;color:var(--green-d);margin-right:9px;vertical-align:-3px;}
table.t td b{display:inline-flex;align-items:flex-start;}
table.t th .ti{color:var(--ink-3);width:13px;height:13px;margin-right:7px;vertical-align:-2px;}
.sti{width:14px;height:14px;vertical-align:-2.5px;margin-right:6px;}
.mk{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:1px;}
.ok,table.t td.ok{color:#4C8A1F;font-weight:500;}
.no,table.t td.no{color:#C4403C;font-weight:500;}
.mid,table.t td.mid{color:#B7861B;font-weight:500;}
/* rating scale · one hue per level, icon and label share it */
table.t td.s-strong{color:#4C8A1F;font-weight:500;}
table.t td.s-implied{color:#2C7FC9;font-weight:500;}
table.t td.s-moderate{color:#B7861B;font-weight:500;}
table.t td.s-weak{color:#C4403C;font-weight:500;}
table.t td.s-none{color:var(--ink-3);font-weight:400;}
.legend{display:flex;align-items:center;gap:22px;}
.legend span{display:inline-flex;align-items:center;font-size:12.5px;font-weight:500;}

/* ---- misc blocks ---- */
.card{border:1px solid var(--line);padding:22px 24px;}
.card.w{background:var(--wash);border-color:var(--line-2);}
.card.g{border-color:var(--green-line);background:#F8FDEE;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
.rule{height:1px;background:var(--line);}
.fstep{width:var(--w);background:var(--c);color:#fff;padding:13px 22px;display:flex;align-items:baseline;gap:14px;margin:0 auto;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,22px 100%);}
.fstep b{font-size:16px;font-weight:600;flex:none;width:20px;}
.fstep span{font-size:12px;font-weight:400;opacity:.85;margin-left:auto;text-align:right;}
.ncat{background:var(--c);color:#fff;padding:18px 20px;display:flex;flex-direction:column;}
.ncat h4{font-size:17px;font-weight:600;letter-spacing:.01em;margin-bottom:8px;}
.ncat p{font-size:13px;font-weight:400;line-height:1.45;opacity:.92;margin-bottom:10px;}
.ncat em{font-size:12px;font-style:normal;font-weight:400;opacity:.8;line-height:1.5;}
.ncat span{margin-top:auto;padding-top:12px;font-size:11px;font-weight:400;opacity:.72;line-height:1.5;}
.refine-row{display:flex;align-items:center;gap:12px;justify-content:center;}
.refine-row span{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#B4B4B4;}
.refine-row i{color:#C8C8C8;font-style:normal;font-size:15px;}
.ltype{border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;}
.ltype .lt-art{height:150px;flex:none;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.ltype h4{font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px;}
.ltype p{font-size:13px;font-weight:400;color:var(--ink-2);line-height:1.45;margin-bottom:8px;}
.ltype em{font-size:12px;font-style:normal;color:var(--ink-3);font-weight:400;}
.ltype span{padding-top:14px;font-size:11.5px;font-weight:400;color:var(--ink-3);line-height:1.45;}
.ltype span.good{color:#4C8A1F;font-weight:500;}
.ltype span.warn{color:#C4403C;font-weight:500;}
.lfeat{border:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;}
.lfeat b{font-size:16px;font-weight:600;letter-spacing:.03em;margin-bottom:12px;}
.lfeat p{font-size:13.5px;font-weight:400;line-height:1.55;color:var(--ink-2);}
.lfeat span{margin-top:auto;padding-top:14px;font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
.compo{display:flex;flex-direction:column;align-items:center;gap:10px;}
.compo span{font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);}
.plus{font-style:normal;font-size:22px;color:#C8C8C8;font-weight:400;}
.astyle{display:flex;flex-direction:column;align-items:center;text-align:center;}
.astyle .as-art{height:88px;display:flex;align-items:center;justify-content:center;}
.astyle h5{font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin:10px 0 6px;}
.redu{height:212px;display:flex;flex-direction:column;align-items:center;gap:12px;border-right:1px solid var(--line);padding:18px 14px;}
.redu .redu-art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
.redu:last-child{border-right:none;}
.redu span{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
.appbox{display:flex;flex-direction:column;align-items:center;gap:11px;}
.appbox span{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
.tier{display:flex;align-items:center;gap:34px;padding:24px 28px;}
.tier-l{flex:1;}
.tier-l b{font-family:var(--fm);font-size:10.5px;letter-spacing:.18em;display:block;margin-bottom:9px;}
.tier-l h4{font-size:20px;font-weight:600;margin-bottom:8px;}
.tier-l p{font-size:13.5px;font-weight:400;line-height:1.55;}
.tier-r{display:flex;gap:9px;flex:none;}
.tier-r i{width:52px;height:52px;display:block;}
.draftbox{border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22px;position:relative;}
.draftbox em{font-family:var(--fm);font-size:10px;font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);}
.draftbox .tagok{position:absolute;top:0;right:0;background:var(--green);color:var(--ink);font-family:var(--fm);font-size:8.5px;letter-spacing:.14em;padding:3px 8px;font-weight:700;}
.draftbox .tagno{position:absolute;top:0;right:0;background:var(--line-2);color:var(--ink-3);font-family:var(--fm);font-size:8.5px;letter-spacing:.14em;padding:3px 8px;}
.famnode{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 14px;text-align:center;position:relative;}
.famnode b{font-size:14px;font-weight:600;letter-spacing:.08em;}
.famnode span{font-size:11.5px;font-weight:400;color:var(--ink-3);}
.famnode i{width:26px;height:3px;display:block;margin-top:8px;}
.famstrip{border:1px solid var(--line-2);background:var(--wash);padding:12px;text-align:center;}
.famstrip span{display:block;font-family:var(--fm);font-size:9px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:5px;}
.famstrip b{font-size:12px;font-weight:600;letter-spacing:.06em;}
.cdrow{display:flex;align-items:center;gap:22px;}
.cdrow .arrow{font-style:normal;font-size:19px;color:#C8C8C8;}
.cdlabel{margin-left:14px;}
.cdlabel b{display:block;font-size:16px;font-weight:600;margin-bottom:4px;}
.cdlabel span{font-size:12.5px;font-weight:400;color:var(--ink-3);}
.numlist2{display:flex;flex-direction:column;gap:20px;justify-content:space-between;height:100%;}
.numlist2 b{display:block;font-size:14.5px;font-weight:600;margin-bottom:6px;}
.numlist2 p{font-size:13px;font-weight:400;line-height:1.55;color:var(--ink-2);}
.refrow{display:flex;align-items:center;gap:14px;}
.refrow svg{width:34px;height:34px;flex:none;}
.syscard{display:flex;flex-direction:column;}
.syscard .sys-art{flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;padding:18px;}
.syscard h4{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.bstile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;}
.bslabel{font-family:var(--fm);font-size:9px;letter-spacing:.14em;color:var(--ink-3);}
.modrow{display:flex;align-items:center;gap:14px;}
.modrow svg{width:38px;height:38px;flex:none;}
.modrow b{font-size:21px;font-weight:600;letter-spacing:-.015em;display:block;}
.modrow em{font-size:15px;font-style:normal;font-weight:400;letter-spacing:.02em;display:block;margin-top:2px;}
.modpair{display:flex;flex-direction:column;gap:9px;}
.mp-top{display:flex;align-items:center;gap:9px;}
.mp-top svg{width:26px;height:26px;flex:none;}
.mp-top b{font-size:16px;font-weight:600;letter-spacing:-.015em;}
.mp-bot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;}
.mp-bot i{width:11px;height:11px;display:block;}
.mp-bot span{font-size:12px;font-weight:600;letter-spacing:.1em;}
.quotecard{border:1px solid var(--line);padding:15px 17px;}
.quotecard p{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.5;margin-bottom:7px;}
.quotecard span{font-size:12px;font-weight:400;color:var(--ink-3);line-height:1.5;}
.refcard{display:flex;flex-direction:column;}
.refcard .rc-art{flex:1;min-height:78px;display:flex;align-items:center;justify-content:center;margin-bottom:11px;padding:14px;gap:8px;}
.refcard h5{font-size:13.5px;font-weight:600;margin-bottom:5px;}
.clogo{display:flex;flex-direction:column;}
.clogo .cl-slot{height:86px;border:1px solid var(--line-2);background:var(--wash);display:flex;align-items:center;justify-content:center;margin-bottom:11px;}
.clogo .cl-slot span{font-family:var(--ft);font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--graphite);text-align:center;padding:0 10px;line-height:1.2;}
.clogo b{font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px;}
.clogo em{font-size:11.5px;font-style:normal;color:var(--ink-3);font-weight:400;}
.refcard2{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;}
.refcard2 .rc-shot{flex:1;min-height:150px;background:var(--wash);border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;margin-bottom:13px;padding:12px;}
.refcard2 .rc-shot span{font-family:var(--fm);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#B0B4A8;text-align:center;padding:0 8px;}
.refcard2 .rc-head b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;}
.refcard2 .rc-head em{font-size:11.5px;font-style:normal;color:var(--ink-3);font-weight:400;}
.refcard2 .rc-url{display:block;font-family:var(--fm);font-size:10px;color:var(--green-d);text-decoration:none;margin:7px 0 11px;word-break:break-all;}
.refcard2 .rc-url:hover{text-decoration:underline;}
.refcard2 .rc-look{display:flex;align-items:center;font-family:var(--fm);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding-bottom:9px;border-bottom:1px solid var(--line-2);margin-bottom:9px;}
.refcard2 .rc-look .ti{width:12px;height:12px;margin-right:6px;}
.refcard2 .rc-good{font-size:12.5px;line-height:1.5;color:var(--ink-2);font-weight:400;margin-bottom:9px;}
.refcard2 .rc-avoid{font-size:12.5px;line-height:1.5;color:var(--ink-3);font-weight:400;margin-top:auto;padding-top:9px;border-top:1px solid var(--line-2);}
.refcard2 .rc-avoid.rc-hard{color:#C4403C;}
.ss-heads{display:grid;grid-template-columns:298px 1fr;gap:16px;margin-bottom:8px;}
.ss-headrow{display:grid;grid-template-columns:1.5fr 1.3fr 1fr 1.2fr 1fr;gap:6px;}
.ss-headrow span{font-size:11.5px;color:var(--ink-3);font-weight:400;text-align:center;padding-bottom:4px;}
.ss-row{display:grid;grid-template-columns:298px 1fr;gap:16px;margin-bottom:13px;height:218px;}
.ss-row.ss-on .ss-label{outline:2px solid var(--green);outline-offset:0;}
.ss-label{padding:16px 18px;display:flex;flex-direction:column;position:relative;}
.ss-tag{font-family:var(--fm);font-size:10.5px;letter-spacing:.2em;font-weight:700;}
.ss-rec{position:absolute;right:14px;top:15px;font-family:var(--fm);font-size:8.5px;letter-spacing:.14em;background:var(--green);color:var(--ink);padding:3px 7px;font-weight:700;}
.ss-name{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:7px;}
.ss-line{font-size:13.5px;font-weight:400;margin-top:3px;}
.ss-kw{font-family:var(--fm);font-size:9px;letter-spacing:.14em;margin-top:11px;}
.ss-note{font-size:12px;line-height:1.5;font-weight:400;margin-top:11px;}
.ss-risk{font-size:11.5px;line-height:1.45;font-weight:500;margin-top:auto;padding-top:8px;}
.ss-strip{display:grid;grid-template-columns:1.5fr 1.3fr 1fr 1.2fr 1fr;gap:6px;}
.ss-cell{overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(11,12,10,.07);}
.ss-cell i{display:block;height:100%;}
.ss-photo{flex:1;border:1px dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;}
.ss-photo span{font-family:var(--fm);font-size:8px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:0 6px;}
.lsd-col{display:flex;flex-direction:column;}
.lsd-head{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.lsd-head b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;}
.lsd-head em{font-size:12.5px;font-style:normal;color:var(--ink-3);font-weight:400;}
.lsd-cells{display:flex;flex-direction:column;gap:12px;flex:1;}
.lsd-cell{flex:1;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:14px;position:relative;min-height:0;}
.lsd-cell > div{display:flex;align-items:center;justify-content:center;}
.lsd-lab{font-family:var(--fm);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);}
.lsd-sw{aspect-ratio:1.12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;}
.amk-grid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);gap:14px;flex:1;min-height:0;}
.amk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:16px;overflow:hidden;}
.amk-in{display:flex;align-items:center;justify-content:center;width:100%;flex:1;min-height:0;}
.amk-lab{font-family:var(--fm);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;flex:none;}
.dev{width:118px;background:var(--ink);border-radius:15px;padding:5px;position:relative;box-shadow:0 8px 24px -10px rgba(11,12,10,.4);}
.dev-notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:34px;height:4px;border-radius:3px;background:var(--ink);z-index:2;}
.dev-scr{background:var(--wash);border-radius:11px;padding:14px 10px 10px;height:238px;display:flex;flex-direction:column;overflow:hidden;}
.dev-lg{width:224px;border-radius:26px;padding:9px;}
.dev-lg .dev-notch{top:16px;width:60px;height:6px;}
.dev-lg .dev-scr{height:512px;border-radius:19px;padding:26px 19px 19px;}
.swatch-lg{height:132px;display:flex;align-items:flex-end;padding:14px;}
/* ---- Agensia wordmark ---- */
.wm{font-family:var(--fd);font-weight:400;letter-spacing:.005em;text-transform:lowercase;line-height:1;}
.agmark{display:block;color:var(--green);}
.mono{font-family:var(--fm);}
/* don'ts row: CSS beats the symbol's fill attribute, so the mark can be shown wrong on purpose */
.dont-outline use{fill:none;stroke:currentColor;stroke-width:.7;}
</style>
</head>
